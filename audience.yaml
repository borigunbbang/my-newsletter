# 주제를 바꿀 때는 이 파일과 source_candidates.yaml만 고치면 된다 (README "새 주제로 만들기")
domain: "AI x Healthcare/Bio"
language: ko
newsletter_name: "헬스케어 AI 데일리"

# 소스 실측(tools/eval_sources.py)의 주제 적합도 판정 기준
topic_fit: >
  헬스케어·바이오 분야에서 AI(머신러닝, 딥러닝, LLM, 알고리즘 기반 의료기기·디지털헬스 포함)를 다루는 기사.
  AI와 무관한 일반 의료·제약 뉴스는 해당하지 않는다.

persona:
  who: "헬스케어 AI 개발자·취준생 (아이펠 수강생, 주니어 ML 엔지니어)"
  when: "매일 오전 8시경, 모바일 텔레그램, 5분 이내"
  needs:
    - "이번 주에 직접 써볼 수 있는 모델·데이터셋·코드·벤치마크"
    - "커리어·프로젝트 방향 판단에 영향을 주는 승인·투자·규제·채용 소식"

importance_question: >
  헬스케어 AI 개발자·취준생이 ① 이번 주 안에 직접 써볼 수 있거나(모델·데이터·코드 공개)
  ② 커리어·프로젝트 방향 판단을 바꾸는(승인·투자·규제·채용) 새로운 사실을 담고 있는가?

# 채택 소스 (근거: store/source_eval.json — 빈도 ≥ 7/주, 접근성 ≥ 80%, 주간 적합 기사 ≥ 7)
sources:
  - name: "arXiv (의료 키워드)"
    lang: EN
    kind: arxiv
    window_hours: 72  # 제출 후 1~2일 뒤 공개되므로 기본보다 길게
    url: "http://export.arxiv.org/api/query?search_query=(cat:cs.LG+OR+cat:cs.CV+OR+cat:eess.IV)+AND+(abs:medical+OR+abs:clinical)&sortBy=submittedDate&sortOrder=descending&max_results=100"
  - name: "더바이오"
    lang: KO
    kind: rss
    url: "https://www.thebionews.net/rss/allArticle.xml"
  - name: "청년의사"
    lang: KO
    kind: rss
    url: "https://www.docdocdoc.co.kr/rss/allArticle.xml"

exclude:
  sources:  # 과제 제외 목록
    - https://openai.com/blog/rss.xml
    - https://deepmind.google/blog/rss.xml
    - https://techcrunch.com/category/artificial-intelligence/feed/
    - https://www.theverge.com/rss/ai-artificial-intelligence/index.xml
    - https://www.technologyreview.com/feed/
    - https://www.aitimes.com/rss/allArticle.xml
  conditions:
    - "AI와 무관한 일반 의료·제약 뉴스 (예선 DROP)"
    - "보도 원문 없이 홍보성 문구만 있는 기사"
    - "이미 발행한 URL (store/seen.json)"
    - "수집 기간(collect.window_hours) 이전 기사"

collect:
  # 24h로 실측하니 0건 (RSS 날짜가 날짜 단위, arXiv 공개 지연) → 48h. 재발행은 seen.json이 막음
  window_hours: 48

prelim:  # 예선 PASS/DROP 조건 (중요도 판단 문장 ①②를 구체화)
  pass:
    - "① 코드·데이터셋·모델·벤치마크 공개가 명시되거나, 의료 AI 개발자가 흔히 다루는 과제(영상 분할·판독, 임상 NLP·의료 LLM, 생체신호 등)에 바로 가져다 쓸 수 있는 범용 도구·평가 방법"
    - "② 실제 환자·병원 대상 검증이나 도입, 승인·규제·투자·채용 소식"
  drop: "헬스케어 적용이 없는 일반 ML, 특정 장비·좁은 물리 모델링처럼 독자가 쓰기 어려운 세부 연구, AI 무관, 홍보성"

selection:
  prelim_batch_size: 10
  final_axes:  # 본선 채점 축 (각 1~5점, 합계로 순위)
    practicality: "독자가 이번 주에 직접 써볼 수 있는가(코드·데이터·모델 공개)"
    novelty: "새로운 사실·방법인가"
    impact: "독자의 커리어·프로젝트·시장에 미치는 영향"
    credibility: "근거 수준(동료심사 > 프리프린트 > 보도자료), 수치·출처의 구체성"
  final_count: {min: 3, max: 5}
  max_per_source: 2

card:  # 기사 카드: 한국어 제목 + 요약 3문장 + 아래 항목 (검수관이 모순·과장 여부를 확인)
  fields:
    - key: dev_action
      label: "👩‍💻 개발자 관점"
      instruction: "독자가 이번 주에 해볼 수 있는 것 1개 (본문 근거가 없으면 '관련 공개 자료 확인' 수준으로)"
    - key: market_context
      label: "📈 시장·규제 맥락"
      instruction: "시장·규제 맥락에서 왜 중요한지 1문장. 본문에 없는 승인·입증·성과를 단정하지 않는다"
    - key: limits
      label: "⚠️ 한계"
      instruction: "표본 수, 외부 검증 부재 등 본문에서 드러나는 한계"
      optional: true
  evidence: ["동료심사 논문", "프리프린트", "보도자료", "기사"]  # 근거 수준 태그 (빈 리스트면 생략)
  evidence_hint: "arXiv는 프리프린트, 학술지 논문은 동료심사 논문"

publish:
  channel: telegram  # telegram (TELEGRAM_BOT_TOKEN·TELEGRAM_CHAT_ID) | discord (DISCORD_WEBHOOK_URL)

review:
  max_regenerations: 2
  max_replacements: 2
  min_publish: 3
